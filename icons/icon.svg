<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="128" y2="128">
      <stop offset="0" stop-color="#7C6CFF"/>
      <stop offset="1" stop-color="#3A2BD4"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#17105C" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <rect width="128" height="128" rx="30" fill="url(#gloss)"/>

  <!-- Monitor -->
  <g filter="url(#shadow)">
    <rect x="14" y="27" width="80" height="56" rx="8" fill="#FFFFFF"/>
    <path d="M47 83h14l3 9H44z" fill="#FFFFFF"/>
    <rect x="38" y="90" width="32" height="6" rx="3" fill="#FFFFFF"/>
  </g>
  <rect x="20" y="33" width="68" height="44" rx="4" fill="#EEECFF"/>
  <rect x="26" y="39" width="24" height="5" rx="2.5" fill="#C4BDFF"/>
  <rect x="26" y="48" width="36" height="3.5" rx="1.75" fill="#D8D3FF"/>
  <!-- Linha sincronizada -->
  <rect x="26" y="60" width="44" height="5" rx="2.5" fill="#FF7A45"/>

  <!-- Recorte à volta do telemóvel -->
  <rect x="69" y="40" width="48" height="72" rx="13" fill="url(#bg)"/>

  <!-- Telemóvel -->
  <g filter="url(#shadow)">
    <rect x="74" y="45" width="38" height="62" rx="9" fill="#FFFFFF"/>
  </g>
  <rect x="78" y="51" width="30" height="50" rx="4" fill="#EEECFF"/>
  <rect x="82" y="54" width="14" height="3.5" rx="1.75" fill="#C4BDFF"/>
  <rect x="82" y="60" width="22" height="5" rx="2.5" fill="#FF7A45"/>
  <rect x="82" y="69" width="18" height="3.5" rx="1.75" fill="#D8D3FF"/>
  <rect x="82" y="76" width="22" height="16" rx="3" fill="#D8D3FF"/>
</svg>
